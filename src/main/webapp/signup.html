<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodOrder - Sign Up</title>

</head>


<body style="
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
    background:#222;
">


<!-- ===================================================== -->
<!-- BACKGROUND VIDEO -->
<!-- ===================================================== -->

<video
    autoplay
    muted
    loop
    playsinline
    style="
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        object-fit:cover;
        z-index:-2;
    ">

    <source
        src="images/auth-food.mp4"
        type="video/mp4">

</video>


<!-- ===================================================== -->
<!-- VIDEO OVERLAY -->
<!-- ===================================================== -->

<div style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(30,20,10,0.48);
    z-index:-1;
">
</div>


<!-- ===================================================== -->
<!-- MAIN PAGE -->
<!-- ===================================================== -->

<div style="
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    box-sizing:border-box;
">


    <!-- ================================================= -->
    <!-- AUTH CARD -->
    <!-- ================================================= -->

    <div style="
        width:100%;
        max-width:470px;
        background:#FFFFFF;
        border-radius:22px;
        overflow:hidden;
        box-shadow:0 20px 55px rgba(0,0,0,0.28);
    ">


        <!-- ============================================= -->
        <!-- BRAND -->
        <!-- ============================================= -->

        <div style="
            text-align:center;
            padding:25px 25px 18px 25px;
            background:#FFFFFF;
        ">

            <a href="index.html"
               style="
                   text-decoration:none;
                   color:#FF6B35;
                   font-size:30px;
                   font-weight:800;
                   letter-spacing:-0.8px;
               ">
                FoodOrder
            </a>


            <p style="
                margin:7px 0 0 0;
                color:#777777;
                font-size:12px;
            ">
                Good Food, Good Mood!
            </p>

        </div>


        <!-- ============================================= -->
        <!-- LOGIN / SIGNUP TABS -->
        <!-- ============================================= -->

        <div style="
            margin:0 30px 25px 30px;
            padding:4px;
            border:1px solid #E2E2E2;
            border-radius:30px;
            display:flex;
            background:#FAFAFA;
            box-sizing:border-box;
        ">


            <!-- LOGIN -->

            <button
                id="loginTab"
                type="button"
                onclick="showLogin()"
                style="
                    width:50%;
                    border:none;
                    border-radius:25px;
                    padding:11px;
                    background:transparent;
                    color:#777777;
                    font-size:13px;
                    font-weight:600;
                    cursor:pointer;
                ">
                Log In
            </button>


            <!-- SIGN UP -->

            <button
                id="signupTab"
                type="button"
                onclick="showSignup()"
                style="
                    width:50%;
                    border:none;
                    border-radius:25px;
                    padding:11px;
                    background:#FF6B35;
                    color:#FFFFFF;
                    font-size:13px;
                    font-weight:700;
                    cursor:pointer;
                ">
                Sign Up
            </button>

        </div>



        <!-- ================================================= -->
        <!-- LOGIN SECTION -->
        <!-- ================================================= -->

        <div
            id="loginSection"
            style="
                display:none;
                padding:0 32px 30px 32px;
            ">


            <!-- TITLE -->

            <h1 style="
                margin:0 0 8px 0;
                color:#222222;
                font-size:27px;
                font-weight:800;
            ">
                Welcome Back
            </h1>


            <p style="
                margin:0 0 22px 0;
                color:#888888;
                font-size:12px;
            ">
                Login to continue enjoying delicious food!
            </p>


            <!-- ERROR MESSAGE -->

            <div
                id="errorMessage"
                style="
                    display:none;
                    background:#FFF0E6;
                    color:#C8461D;
                    border:1px solid #FFD1BC;
                    border-radius:8px;
                    padding:10px;
                    text-align:center;
                    font-size:12px;
                    margin-bottom:15px;
                ">
                Invalid email or password.
            </div>


            <!-- LOGIN FORM -->

            <form
                action="login"
                method="post">


                <!-- EMAIL -->

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                    style="
                        width:100%;
                        height:45px;
                        box-sizing:border-box;
                        padding:0 16px;
                        margin-bottom:13px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:13px;
                        color:#444444;
                    "
                >


                <!-- PASSWORD -->

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    style="
                        width:100%;
                        height:45px;
                        box-sizing:border-box;
                        padding:0 16px;
                        margin-bottom:10px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:13px;
                        color:#444444;
                    "
                >


                <!-- FORGOT PASSWORD -->

                <div style="
                    text-align:right;
                    margin-bottom:20px;
                ">

                    <a href="#"
                       style="
                           text-decoration:none;
                           color:#FF6B35;
                           font-size:11px;
                       ">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    style="
                        width:100%;
                        height:46px;
                        border:none;
                        border-radius:9px;
                        background:#FF6B35;
                        color:#FFFFFF;
                        font-size:14px;
                        font-weight:700;
                        cursor:pointer;
                        box-shadow:0 7px 18px rgba(255,107,53,0.22);
                    ">
                    LOG IN →
                </button>

            </form>


            <!-- OR -->

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
                margin:22px 0 18px 0;
            ">

                <div style="
                    flex:1;
                    height:1px;
                    background:#E5E5E5;
                ">
                </div>


                <span style="
                    color:#999999;
                    font-size:11px;
                ">
                    OR
                </span>


                <div style="
                    flex:1;
                    height:1px;
                    background:#E5E5E5;
                ">
                </div>

            </div>


            <!-- SWITCH TO SIGNUP -->

            <p style="
                text-align:center;
                color:#777777;
                font-size:12px;
                margin:0;
            ">

                Don't have an account?

                <a
                    href="#"
                    onclick="showSignup(); return false;"
                    style="
                        color:#FF6B35;
                        text-decoration:none;
                        font-weight:bold;
                    ">
                    Sign Up
                </a>

            </p>

        </div>



        <!-- ================================================= -->
        <!-- SIGNUP SECTION -->
        <!-- ================================================= -->

        <div
            id="signupSection"
            style="
                display:block;
                padding:0 32px 30px 32px;
            ">


            <!-- TITLE -->

            <h1 style="
                margin:0 0 8px 0;
                color:#222222;
                font-size:27px;
                font-weight:800;
            ">
                Create Your Account
            </h1>


            <p style="
                margin:0 0 20px 0;
                color:#888888;
                font-size:12px;
            ">
                Join FoodOrder and enjoy delicious food!
            </p>



            <!-- ============================================= -->
            <!-- SIGNUP FORM -->
            <!-- ============================================= -->

            <form
                action="SignupServlet"
                method="post">


                <!-- FULL NAME -->

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                    style="
                        width:100%;
                        height:43px;
                        box-sizing:border-box;
                        padding:0 16px;
                        margin-bottom:11px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:12px;
                        color:#444444;
                    "
                >


                <!-- EMAIL -->

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                    style="
                        width:100%;
                        height:43px;
                        box-sizing:border-box;
                        padding:0 16px;
                        margin-bottom:11px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:12px;
                        color:#444444;
                    "
                >


                <!-- PASSWORD -->

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    style="
                        width:100%;
                        height:43px;
                        box-sizing:border-box;
                        padding:0 16px;
                        margin-bottom:11px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:12px;
                        color:#444444;
                    "
                >


                <!-- PHONE -->

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                    style="
                        width:100%;
                        height:43px;
                        box-sizing:border-box;
                        padding:0 16px;
                        margin-bottom:11px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:12px;
                        color:#444444;
                    "
                >


                <!-- ADDRESS -->

                <textarea
                    name="address"
                    placeholder="Address"
                    required
                    style="
                        width:100%;
                        height:65px;
                        box-sizing:border-box;
                        padding:12px 16px;
                        margin-bottom:14px;
                        border:1px solid #DDDDDD;
                        border-radius:9px;
                        outline:none;
                        background:#FAFAFA;
                        font-size:12px;
                        font-family:Arial, Helvetica, sans-serif;
                        resize:none;
                        color:#444444;
                    "
                ></textarea>


                <!-- SIGNUP BUTTON -->

                <button
                    type="submit"
                    style="
                        width:100%;
                        height:46px;
                        border:none;
                        border-radius:9px;
                        background:#FF6B35;
                        color:#FFFFFF;
                        font-size:14px;
                        font-weight:700;
                        cursor:pointer;
                        box-shadow:0 7px 18px rgba(255,107,53,0.22);
                    ">
                    SIGN UP →
                </button>

            </form>



            <!-- OR -->

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
                margin:20px 0;
            ">

                <div style="
                    flex:1;
                    height:1px;
                    background:#E5E5E5;
                ">
                </div>


                <span style="
                    color:#999999;
                    font-size:11px;
                ">
                    OR
                </span>


                <div style="
                    flex:1;
                    height:1px;
                    background:#E5E5E5;
                ">
                </div>

            </div>



            <!-- SWITCH TO LOGIN -->

            <p style="
                text-align:center;
                color:#777777;
                font-size:12px;
                margin:0;
            ">

                Already have an account?

                <a
                    href="#"
                    onclick="showLogin(); return false;"
                    style="
                        color:#FF6B35;
                        text-decoration:none;
                        font-weight:bold;
                    ">
                    Log In
                </a>

            </p>

        </div>

    </div>

</div>



<!-- ===================================================== -->
<!-- LOGIN / SIGNUP JAVASCRIPT -->
<!-- ===================================================== -->

<script>

function showLogin() {

    document.getElementById("loginSection").style.display = "block";

    document.getElementById("signupSection").style.display = "none";


    document.getElementById("loginTab").style.background = "#FF6B35";

    document.getElementById("loginTab").style.color = "#FFFFFF";

    document.getElementById("loginTab").style.fontWeight = "700";


    document.getElementById("signupTab").style.background = "transparent";

    document.getElementById("signupTab").style.color = "#777777";

    document.getElementById("signupTab").style.fontWeight = "600";

}


function showSignup() {

    document.getElementById("loginSection").style.display = "none";

    document.getElementById("signupSection").style.display = "block";


    document.getElementById("signupTab").style.background = "#FF6B35";

    document.getElementById("signupTab").style.color = "#FFFFFF";

    document.getElementById("signupTab").style.fontWeight = "700";


    document.getElementById("loginTab").style.background = "transparent";

    document.getElementById("loginTab").style.color = "#777777";

    document.getElementById("loginTab").style.fontWeight = "600";

}

</script>



<!-- ===================================================== -->
<!-- LOGIN ERROR -->
<!-- ===================================================== -->

<script>

const urlParams =
    new URLSearchParams(window.location.search);

const error =
    urlParams.get("error");

if (error === "invalid") {

    showLogin();

    document.getElementById("errorMessage")
        .style.display = "block";

}

</script>


</body>

</html>
